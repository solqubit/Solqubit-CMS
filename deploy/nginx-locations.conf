# Include inside the domain's existing server block. Keep its document root.
# Replace unix:/run/php/php-fpm.sock with the PHP-FPM upstream configured by your panel.
client_max_body_size 40m;

location = /solqubit-core { return 404; }
location ^~ /solqubit-core/ { return 404; }

location / {
    try_files $uri $uri/ /index.php?$query_string;
}
location ~ /\.(?!well-known/) {
    deny all;
}
location = /index.php {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    fastcgi_pass unix:/run/php/php-fpm.sock;
    fastcgi_read_timeout 120s;
}
location ~ \.(?:php[0-9]?|phtml|phar)(?:/|$) {
    return 404;
}
location ~* \.(?:env|ini|log|sql|sqlite|zip|bak|lock)$ {
    deny all;
}
# Theme assets are linked with ?v=<timestamp>, so a long browser cache is safe.
location ~* \.(?:css|js|mjs|woff2?|ttf|svg|png|jpe?g|webp|avif|gif|ico)$ {
    try_files $uri /index.php?$query_string;
    expires 30d;
}
