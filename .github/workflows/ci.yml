name: Pruebas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cms:
    name: PHP ${{ matrix.php }} · ${{ matrix.database }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        database: ['sqlite']
        include:
          - php: '8.4'
            database: mariadb
    services:
      mariadb:
        # An empty image skips the service on the SQLite entries.
        image: ${{ matrix.database == 'mariadb' && 'mariadb:11' || '' }}
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: solqubit_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      # tests/TestCase.php only accepts SQLite :memory: or a MySQL-driver database whose name ends in _test.
      DB_CONNECTION: ${{ matrix.database == 'mariadb' && 'mysql' || 'sqlite' }}
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: ${{ matrix.database == 'mariadb' && 'solqubit_test' || ':memory:' }}
      DB_USERNAME: root
      DB_PASSWORD: ${{ matrix.database == 'mariadb' && 'root' || '' }}
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, zip, gd, bcmath, pdo_mysql, pdo_sqlite, exif
          tools: composer:v2
          coverage: none
      - name: Localizar la caché de Composer
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ matrix.php }}-${{ hashFiles('core/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php${{ matrix.php }}-
      - name: Preparar el entorno de pruebas
        run: |
          mkdir -p storage/app/media storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs bootstrap/cache
          cp .env.example .env
          composer install --prefer-dist --no-interaction --no-progress
          php artisan key:generate --no-interaction
      - name: Comprobar dependencias y ejecutar pruebas
        run: |
          composer validate --no-check-publish
          composer check-platform-reqs
          composer test -- --compact

  quality:
    name: Estilo de PHP y pruebas de JavaScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, zip, gd, bcmath, pdo_mysql, pdo_sqlite
          tools: composer:v2
          coverage: none
      - name: Localizar la caché de Composer
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php8.4-${{ hashFiles('core/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php8.4-
      - name: Instalar dependencias
        run: |
          mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs bootstrap/cache
          cp .env.example .env
          composer install --prefer-dist --no-interaction --no-progress
      - name: Comprobar el formato con Pint
        run: vendor/bin/pint --test
      - name: Ejecutar las pruebas de JavaScript
        run: node --test tests/JavaScript/*.mjs
