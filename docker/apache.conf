<VirtualHost *:80>
    DocumentRoot /var/www/site
    <Directory /var/www/site>
        AllowOverride All
        Options -Indexes +FollowSymLinks
        Require all granted
    </Directory>
    <Directory /var/www/core>
        Require all denied
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

